<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiệm Bánh Mì NGUYÊN - Đặt Món Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 15px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #ff4500; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥖 Tiệm Bánh Mì NGUYÊN</h2>
    <p>Vui lòng chọn món và điền thông tin bên dưới:</p>
    
    <div id="menu-container">
        <!-- Danh sách món ăn sẽ load ở đây -->
        <div class="item">
            <span>Bánh mì heo quay giòn bì (30,000đ)</span>
            <button onclick="selectItem('Bánh mì heo quay giòn bì', 30000)" style="width: auto; padding: 5px 10px;">Chọn</button>
        </div>
    </div>

    <h3>Giỏ hàng của bạn:</h3>
    <ul id="cart-list">Chưa chọn món nào</ul>

    <hr>
    <h3>Thông tin liên hệ</h3>
    <label>Tên khách hàng:</label>
    <input type="text" id="custName" placeholder="Nhập tên của bạn..." oninput="validateForm()">

    <label>Số điện thoại (Bắt buộc):</label>
    <input type="tel" id="custPhone" placeholder="Nhập số điện thoại..." oninput="validateForm()">

    <label>Ghi chú (Tối đa 1000 ký tự):</label>
    <textarea id="custNote" maxlength="1000" rows="3" placeholder="Ví dụ: Không hành, thêm tương ớt..."></textarea>

    <button id="btnSubmit" onclick="submitOrder()" disabled>XÁC NHẬN ĐẶT HÀNG</button>
</div>

<script>
    let selectedItems = [];

    function selectItem(name, price) {
        selectedItems.push({ name: name, price: price, quantity: 1 });
        updateCartUI();
        validateForm();
    }

    function updateCartUI() {
        let cartList = document.getElementById('cart-list');
        if (selectedItems.length === 0) {
            cartList.innerHTML = 'Chưa chọn món nào';
            return;
        }
        cartList.innerHTML = selectedItems.map(i => `<li>${i.name} - ${i.price}đ</li>`).join('');
    }

    function validateForm() {
        let name = document.getElementById('custName').value.trim();
        let phone = document.getElementById('custPhone').value.trim();
        let btn = document.getElementById('btnSubmit');
        
        // Điều kiện: Phải có món, có tên và số điện thoại mới cho bấm đặt hàng
        if (selectedItems.length > 0 && name.length > 0 && phone.length >= 9) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    async function submitOrder() {
    let customerName = document.getElementById('custName').value.trim();
    let phone = document.getElementById('custPhone').value.trim();
    let note = document.getElementById('custNote').value.trim();

    if (selectedItems.length === 0) {
        alert('Vui lòng chọn ít nhất một món!');
        return;
    }

    // Tổng hợp nội dung tin nhắn gửi vào Telegram
    let itemsText = selectedItems.map(i => `- ${i.name} (x${i.quantity}): ${i.price * i.quantity}đ`).join('\n');
    let totalMoney = selectedItems.reduce((sum, i) => sum + (i.price * i.quantity), 0);

    let message = `🚨 *CÓ ĐƠN HÀNG ONLINE MỚI!* 🥖\n\n` +
                  `👤 *Khách hàng:* ${customerName}\n` +
                  `📞 *Số điện thoại:* ${phone}\n` +
                  `📝 *Ghi chú:* ${note || 'Không có'}\n\n` +
                  `🛒 *Chi tiết món:*\n${itemsText}\n\n` +
                  `💰 *TỔNG TIỀN:* *${totalMoney.toLocaleString()}đ*`;

    // Thay thế TOKEN và CHAT_ID của anh vào đây
    const BOT_TOKEN = '8504426877:AAHHT99NJRxpdeSwg2cjCuukbpjwQWR0t0g';
    const CHAT_ID = '-5368737820';
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    try {
        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        });

        let result = await response.json();
        if (result.ok) {
            alert('Đặt hàng thành công! Quán đã nhận được đơn của bạn.');
            selectedItems = [];
            updateCartUI();
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custNote').value = '';
            validateForm();
        } else {
            alert('Có lỗi xảy ra khi gửi đơn hàng!');
        }
    } catch (e) {
        alert('Không thể kết nối đến hệ thống!');
    }
}
</script>

</body>
</html>
