<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tiệm Bánh Mì NGUYÊN - Đặt Món Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Cấu hình Web App / Shortcut cho điện thoại -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bánh Mì NGUYÊN">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 15px; margin: 0; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { max-width: 130px; height: auto; border-radius: 50%; border: 3px solid #ff4500; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Giao diện danh mục và món ăn dạng lưới */
        .category-title { font-size: 16px; font-weight: bold; color: #ff4500; margin: 20px 0 10px 0; border-bottom: 2px solid #ff4500; padding-bottom: 5px; text-transform: uppercase; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        
        /* Thẻ món ăn sinh động tích hợp hình ảnh */
        .food-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .food-card:hover {
            border-color: #ff4500;
            background: #fff9f5;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255,69,0,0.15);
        }
        .food-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 8px;
            background: #f0f0f0;
        }
        .food-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .food-name { font-weight: bold; font-size: 13px; margin-bottom: 4px; color: #222; line-height: 1.3; }
        .food-price { color: #ff4500; font-size: 13px; font-weight: bold; }

        /* Giỏ hàng */
        .cart-section { background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #eee; margin-top: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed #ddd; font-size: 13px; }
        
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        /* Nút xác nhận đặt hàng */
        .btn-submit { background: #ff4500; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; box-shadow: 0 3px 6px rgba(255,69,0,0.2); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }
        
        /* Nút tạo Shortcut màn hình chính */
        .btn-shortcut {
            background: #fff0eb;
            color: #ff4500;
            border: 1px dashed #ff4500;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Nút xóa trong giỏ hàng */
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto !important; }
        
        /* Popup xác nhận & Hướng dẫn Shortcut */
        #confirmModal, #shortcutModal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 20% auto; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Logo & Thông tin quán -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo Tiệm Bánh Mì Nguyên" onerror="this.src='https://via.placeholder.com/130?text=Logo+Nguyen'">
        <h2>🥖 Tiệm Bánh Mì NGUYÊN</h2>
        <p style="font-size: 12px; color: #555; margin: 3px 0;">📍 SN 372, Đường Quang Trung, Thái Nguyên</p>
        <p style="font-size: 13px; color: #ff4500; font-weight: bold; margin: 3px 0;">📞 Alo ship: 0973.818.199</p>
    </div>
    
    <!-- Danh sách Menu phân theo danh mục -->
    <div id="menu-container">
        <p style="text-align: center; color: #666;">Đang tải thực đơn...</p>
    </div>

    <!-- Giỏ hàng -->
    <div class="cart-section">
        <h3 style="margin-top: 0; font-size: 15px; color: #333;">🛒 Giỏ hàng của bạn:</h3>
        <div id="cart-list" style="color: #666; font-style: italic; font-size: 13px;">Chưa chọn món nào</div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <h3 style="font-size: 15px; margin-bottom: 10px;">Thông tin nhận hàng</h3>
    <label style="font-size: 13px; font-weight: bold;">Tên khách hàng:</label>
    <input type="text" id="custName" placeholder="Nhập tên của bạn..." oninput="validateForm()">

    <label style="font-size: 13px; font-weight: bold;">Số điện thoại (Bắt buộc):</label>
    <input type="tel" id="custPhone" placeholder="Nhập số điện thoại..." oninput="validateForm()">

    <label style="font-size: 13px; font-weight: bold;">Ghi chú:</label>
    <textarea id="custNote" maxlength="1000" rows="2" placeholder="Ví dụ: Không hành, thêm tương ớt..."></textarea>

    <!-- Nút xác nhận đặt hàng -->
    <button type="button" id="btnSubmit" class="btn-submit" onclick="showConfirmPopup(event)" disabled>XÁC NHẬN ĐẶT HÀNG</button>
